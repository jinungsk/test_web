<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>먹지 2048</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Song+Myung&family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  :root{
    --paper: #f3ecd9;
    --paper-dark: #e8ddc2;
    --ink: #2b2a28;
    --ink-soft: #4a453d;
    --jade: #3f6e5f;
    --jade-dark: #2c4f44;
    --seal: #a8342a;
    --gold: #b4922f;
  }
  *{ box-sizing:border-box; -webkit-tap-highlight-color: transparent; }
  html,body{
    margin:0; padding:0; height:100%;
    background: var(--paper);
    background-image:
      radial-gradient(ellipse at top left, rgba(0,0,0,0.03), transparent 55%),
      radial-gradient(ellipse at bottom right, rgba(0,0,0,0.04), transparent 55%);
    font-family:'Noto Sans KR', sans-serif;
    color: var(--ink);
    display:flex;
    align-items:center;
    justify-content:center;
    overflow-x:hidden;
  }
  .stage{
    width:100%;
    max-width:460px;
    padding: 28px 18px 40px;
  }
  .header{
    display:flex;
    align-items:flex-end;
    justify-content:space-between;
    margin-bottom:18px;
  }
  .title-wrap{ display:flex; align-items:center; gap:12px; }
  .seal{
    width:46px; height:46px;
    border-radius:8px;
    background: var(--seal);
    color:#f3ecd9;
    display:flex; align-items:center; justify-content:center;
    font-family:'Song Myung', serif;
    font-size:22px;
    box-shadow: inset 0 0 0 2px rgba(255,255,255,0.18);
    transform: rotate(-3deg);
    flex-shrink:0;
  }
  h1{
    font-family:'Song Myung', serif;
    font-size: 30px;
    margin:0;
    letter-spacing: 1px;
    line-height:1.1;
  }
  h1 span{
    display:block;
    font-family:'Noto Sans KR', sans-serif;
    font-size: 11px;
    font-weight:500;
    color: var(--ink-soft);
    letter-spacing: 3px;
    margin-top:3px;
  }
  .scorebox{
    background: var(--ink);
    color: var(--paper);
    border-radius: 6px;
    padding: 6px 14px;
    text-align:center;
    min-width:64px;
  }
  .scorebox .label{ font-size:9px; letter-spacing:2px; opacity:0.65; }
  .scorebox .value{ font-family:'Song Myung', serif; font-size:20px; line-height:1.3; }

  .toolbar{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:16px;
  }
  .hint{ font-size:12px; color: var(--ink-soft); }
  .newgame{
    font-family:'Noto Sans KR', sans-serif;
    font-weight:700;
    font-size:13px;
    background: var(--jade);
    color: var(--paper);
    border:none;
    border-radius: 5px;
    padding: 9px 16px;
    cursor:pointer;
    letter-spacing: 0.5px;
    transition: background 0.15s ease, transform 0.1s ease;
  }
  .newgame:active{ transform: scale(0.96); }
  .newgame:hover{ background: var(--jade-dark); }

  .board-frame{
    position:relative;
    background: var(--ink);
    border-radius: 12px;
    padding: 10px;
    box-shadow: 0 12px 28px rgba(43,42,40,0.28), inset 0 0 0 1px rgba(255,255,255,0.05);
  }
  .board{
    position:relative;
    display:grid;
    grid-template-columns: repeat(4, 1fr);
    grid-template-rows: repeat(4, 1fr);
    gap: 10px;
    aspect-ratio: 1 / 1;
  }
  .cell-bg{
    background: rgba(243,236,217,0.08);
    border-radius: 8px;
  }
  .tiles-layer{
    position:absolute;
    inset:10px;
    display:grid;
    grid-template-columns: repeat(4, 1fr);
    grid-template-rows: repeat(4, 1fr);
    gap: 10px;
  }
  .tile{
    position:absolute;
    display:flex;
    align-items:center;
    justify-content:center;
    border-radius: 8px;
    font-family:'Song Myung', serif;
    font-weight:400;
    box-shadow: 0 3px 8px rgba(0,0,0,0.25), inset 0 0 0 1px rgba(0,0,0,0.06);
    transition: left 0.11s ease, top 0.11s ease, transform 0.1s ease;
    user-select:none;
  }
  .tile.spawn{ animation: pop 0.18s ease; }
  .tile.merged{ animation: bump 0.16s ease; }
  @keyframes pop{ from{ transform:scale(0.3); opacity:0;} to{ transform:scale(1); opacity:1;} }
  @keyframes bump{ 0%{ transform:scale(1);} 45%{ transform:scale(1.14);} 100%{ transform:scale(1);} }

  .overlay{
    position:absolute; inset:10px;
    background: rgba(243,236,217,0.92);
    border-radius: 8px;
    display:none;
    align-items:center; justify-content:center;
    flex-direction:column;
    gap:10px;
    text-align:center;
    z-index:10;
  }
  .overlay.show{ display:flex; }
  .overlay h2{ font-family:'Song Myung', serif; font-size:26px; margin:0; color:var(--ink); }
  .overlay p{ margin:0; font-size:13px; color:var(--ink-soft); }
  .overlay button{
    margin-top:6px;
    font-family:'Noto Sans KR', sans-serif;
    font-weight:700;
    background: var(--seal);
    color:#f3ecd9;
    border:none;
    border-radius:5px;
    padding: 9px 18px;
    font-size:13px;
    cursor:pointer;
  }

  footer{
    margin-top: 18px;
    text-align:center;
    font-size:11px;
    color: var(--ink-soft);
    letter-spacing: 0.5px;
  }

  @media (max-width:380px){
    h1{ font-size:24px; }
    .seal{ width:38px; height:38px; font-size:18px; }
  }
</style>
</head>
<body>

<div class="stage">
  <div class="header">
    <div class="title-wrap">
      <div class="seal">墨</div>
      <h1>먹지 2048<span>INK &amp; PAPER PUZZLE</span></h1>
    </div>
    <div class="scorebox">
      <div class="label">SCORE</div>
      <div class="value" id="score">0</div>
    </div>
  </div>

  <div class="toolbar">
    <div class="hint" id="hint">화살표 키 또는 스와이프로 이동</div>
    <button class="newgame" id="newgame">새 게임</button>
  </div>

  <div class="board-frame">
    <div class="board" id="board">
      <div class="cell-bg"></div><div class="cell-bg"></div><div class="cell-bg"></div><div class="cell-bg"></div>
      <div class="cell-bg"></div><div class="cell-bg"></div><div class="cell-bg"></div><div class="cell-bg"></div>
      <div class="cell-bg"></div><div class="cell-bg"></div><div class="cell-bg"></div><div class="cell-bg"></div>
      <div class="cell-bg"></div><div class="cell-bg"></div><div class="cell-bg"></div><div class="cell-bg"></div>
      <div class="tiles-layer" id="tilesLayer"></div>
      <div class="overlay" id="overlay">
        <h2 id="overlayTitle">게임 종료</h2>
        <p id="overlaySub">더 이상 움직일 수 없습니다</p>
        <button id="overlayBtn">다시 시작</button>
      </div>
    </div>
  </div>

  <footer>같은 숫자 도장을 합쳐 2048을 완성하세요</footer>
</div>

<script>
(function(){
  const SIZE = 4;
  const boardEl = document.getElementById('board');
  const layerEl = document.getElementById('tilesLayer');
  const scoreEl = document.getElementById('score');
  const overlayEl = document.getElementById('overlay');
  const overlayTitle = document.getElementById('overlayTitle');
  const overlaySub = document.getElementById('overlaySub');
  const overlayBtn = document.getElementById('overlayBtn');
  const newGameBtn = document.getElementById('newgame');

  let grid, score, tileId, won, over, cellSize, gap;

  const palette = {
    2:   { bg:'#f3ecd9', fg:'#2b2a28' },
    4:   { bg:'#e6dcb8', fg:'#2b2a28' },
    8:   { bg:'#c9a860', fg:'#2b2a28' },
    16:  { bg:'#b4922f', fg:'#f3ecd9' },
    32:  { bg:'#8f9b3f', fg:'#f3ecd9' },
    64:  { bg:'#3f6e5f', fg:'#f3ecd9' },
    128: { bg:'#2c4f44', fg:'#f3ecd9' },
    256: { bg:'#5b7a9e', fg:'#f3ecd9' },
    512: { bg:'#3a4f73', fg:'#f3ecd9' },
    1024:{ bg:'#7c3b5e', fg:'#f3ecd9' },
    2048:{ bg:'#a8342a', fg:'#f3ecd9' }
  };
  function paletteFor(v){
    if(palette[v]) return palette[v];
    return { bg:'#2b2a28', fg:'#f3ecd9' };
  }

  function newGrid(){
    return Array.from({length:SIZE}, () => Array(SIZE).fill(null));
  }

  function measure(){
    const rect = boardEl.getBoundingClientRect();
    gap = 10;
    cellSize = (rect.width - gap*(SIZE-1)) / SIZE;
  }

  function posFor(r,c){
    return { x: c*(cellSize+gap), y: r*(cellSize+gap) };
  }

  function init(){
    grid = newGrid();
    score = 0;
    tileId = 1;
    won = false;
    over = false;
    scoreEl.textContent = '0';
    overlayEl.classList.remove('show');
    layerEl.innerHTML = '';
    measure();
    addRandomTile();
    addRandomTile();
    render(true);
  }

  function addRandomTile(){
    const empties = [];
    for(let r=0;r<SIZE;r++) for(let c=0;c<SIZE;c++) if(!grid[r][c]) empties.push([r,c]);
    if(empties.length===0) return;
    const [r,c] = empties[Math.floor(Math.random()*empties.length)];
    const value = Math.random() < 0.9 ? 2 : 4;
    grid[r][c] = { id: tileId++, value, r, c, isNew:true, merged:false };
  }

  function render(){
    measure();
    layerEl.innerHTML = '';
    for(let r=0;r<SIZE;r++){
      for(let c=0;c<SIZE;c++){
        const t = grid[r][c];
        if(!t) continue;
        const el = document.createElement('div');
        el.className = 'tile' + (t.isNew ? ' spawn':'') + (t.merged ? ' merged':'');
        const p = posFor(r,c);
        el.style.left = p.x+'px';
        el.style.top = p.y+'px';
        el.style.width = cellSize+'px';
        el.style.height = cellSize+'px';
        const pal = paletteFor(t.value);
        el.style.background = pal.bg;
        el.style.color = pal.fg;
        el.style.fontSize = (t.value >= 1000 ? cellSize*0.32 : cellSize*0.4) + 'px';
        el.textContent = t.value;
        layerEl.appendChild(el);
        t.isNew = false;
        t.merged = false;
      }
    }
    scoreEl.textContent = score;
  }

  function cloneFlat(){
    return grid.map(row => row.map(t => t ? {...t} : null));
  }

  function gridsEqual(a,b){
    for(let r=0;r<SIZE;r++) for(let c=0;c<SIZE;c++){
      const va = a[r][c]?a[r][c].value:0;
      const vb = b[r][c]?b[r][c].value:0;
      if(va!==vb) return false;
    }
    return true;
  }

  function move(dir){
    if(over) return;
    const before = cloneFlat();
    let moved = false;

    const order = [];
    for(let i=0;i<SIZE;i++) order.push(i);
    // Build line order depending on direction
    const lines = [];
    if(dir==='left' || dir==='right'){
      for(let r=0;r<SIZE;r++){
        let idxs = order.map(c=>({r,c}));
        if(dir==='right') idxs = idxs.reverse();
        lines.push(idxs);
      }
    } else {
      for(let c=0;c<SIZE;c++){
        let idxs = order.map(r=>({r,c}));
        if(dir==='down') idxs = idxs.reverse();
        lines.push(idxs);
      }
    }

    for(const line of lines){
      const tiles = line.map(pos => grid[pos.r][pos.c]).filter(Boolean);
      const merged = [];
      for(let i=0;i<tiles.length;i++){
        if(i<tiles.length-1 && tiles[i].value === tiles[i+1].value && !tiles[i].consumed && !tiles[i+1].consumed){
          const newVal = tiles[i].value*2;
          merged.push({ id: tiles[i].id, value:newVal, merged:true });
          tiles[i+1].consumed = true;
          score += newVal;
          if(newVal===2048) won = true;
          i++;
        } else if(!tiles[i].consumed){
          merged.push({ id: tiles[i].id, value: tiles[i].value, merged:false });
        }
      }
      for(let i=0;i<line.length;i++){
        const pos = line[i];
        const data = merged[i];
        if(data){
          grid[pos.r][pos.c] = { id:data.id, value:data.value, r:pos.r, c:pos.c, isNew:false, merged:data.merged };
        } else {
          grid[pos.r][pos.c] = null;
        }
      }
    }

    moved = !gridsEqual(before, grid);
    if(moved){
      addRandomTile();
      render();
      if(won){
        showOverlay('축하합니다!', '2048 도장을 완성했습니다', '계속하기');
        won = false; // allow continue, don't end game
      } else if(!hasMoves()){
        over = true;
        showOverlay('게임 종료', '더 이상 움직일 수 없습니다', '다시 시작');
      }
    }
  }

  function hasMoves(){
    for(let r=0;r<SIZE;r++){
      for(let c=0;c<SIZE;c++){
        if(!grid[r][c]) return true;
        const v = grid[r][c].value;
        if(c<SIZE-1 && grid[r][c+1] && grid[r][c+1].value===v) return true;
        if(r<SIZE-1 && grid[r+1][c] && grid[r+1][c].value===v) return true;
      }
    }
    return false;
  }

  function showOverlay(title, sub, btnLabel){
    overlayTitle.textContent = title;
    overlaySub.textContent = sub;
    overlayBtn.textContent = btnLabel;
    overlayEl.classList.add('show');
  }

  overlayBtn.addEventListener('click', () => {
    overlayEl.classList.remove('show');
    if(overlayBtn.textContent === '다시 시작') init();
  });
  newGameBtn.addEventListener('click', init);

  window.addEventListener('keydown', (e) => {
    const map = { ArrowLeft:'left', ArrowRight:'right', ArrowUp:'up', ArrowDown:'down' };
    if(map[e.key]){
      e.preventDefault();
      move(map[e.key]);
    }
  });

  // touch swipe
  let touchStartX=0, touchStartY=0;
  boardEl.addEventListener('touchstart', (e)=>{
    const t = e.changedTouches[0];
    touchStartX = t.clientX; touchStartY = t.clientY;
  }, {passive:true});
  boardEl.addEventListener('touchend', (e)=>{
    const t = e.changedTouches[0];
    const dx = t.clientX - touchStartX;
    const dy = t.clientY - touchStartY;
    if(Math.max(Math.abs(dx),Math.abs(dy)) < 24) return;
    if(Math.abs(dx) > Math.abs(dy)){
      move(dx>0 ? 'right' : 'left');
    } else {
      move(dy>0 ? 'down' : 'up');
    }
  }, {passive:true});

  window.addEventListener('resize', render);

  init();
})();
</script>
</body>
</html>
